---
# tasks file for virt_service

# Intall required packages.
- name: "Manage Virtualization Packages"
  ansible.builtin.package:
    name:
      - "libvirt"
      - "libvirt-client"
      - "libvirt-daemon-config-network"
      - "qemu-kvm"
      - "genisoimage"
    state: "present"
  become: true

# If Cockpit is installed, install the cockpit-machines package.
- name: "Manage cockpit Machines Packages"
  include_role:
    name: cervoevo.homelab.cockpit_modules
    tasks_from: machine_module.yml
  when: installed.cockpit

# Start and enable virtualization services.
- name: "Manage Virtualization Services"
  ansible.builtin.service:
    name: "{{ item }}"
    state: "started"
    enabled: true
  become: true
  loop:
    - "virtqemud.service"
    - "virtnetworkd.service"

- name: "Manage network Packages"
  ansible.builtin.package:
    name:
      - "bridge-utils"
      - "python-lxml"
    state: "present"
  become: true

# Create a physical bridge and add a physical interface to it.
- name: "Manage physical bridge Device"
  community.general.nmcli:
    type: "bridge"
    conn_name: "phybr0"
    ifname: "phybr0"
    stp: true
    state: present
  become: true
  notify:
  - "Reboot system"

- name: "Manage physical bridge Member"
  community.general.nmcli:
    conn_name: "enp0s25"
    ifname: "enp0s25"
    type: "ethernet"
    slave_type: "bridge"
    master: "phybr0"
    state: "present"
  become: true
  notify:
  - "Reboot system"
