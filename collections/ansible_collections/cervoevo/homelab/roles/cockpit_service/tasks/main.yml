---
# tasks file for cockpit_service
# Manage Cockpit 
- name: "Manage cockpit Packages"
  ansible.builtin.package:
    name:
      - "cockpit"
      - "cockpit-selinux"
      - "cockpit-sosreport"
    state: "present"
  become: true

- name: "Manage cockpit Services"
  ansible.builtin.service:
    name: "cockpit.socket"
    state: "started"
    enabled: true
  become: true

# If Cockpit is installed, install the cockpit-machines package.
- name: "Manage cockpit pcp Packages"
  include_role:
    name: cervoevo.homelab.cockpit_modules
    tasks_from: pcp_module.yml
  when: installed.cockpit

- name: "Manage cockpit Firewall Policy"
  ansible.posix.firewalld:
    service: "cockpit"
    state: "enabled"
    immediate: true
    permanent: true
  become: true

